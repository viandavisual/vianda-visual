<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<title>Vianda Visual — Josep Maria Solé</title>
<meta name="description" content="Creative Developer · App Developer">

</head>
<body>
<header><div class="wrap"><nav>
  <div class="brandwrap"><a href="#" class="brand" id="brand">VIANDA VISUAL</a></div>
  <div class="navright">
    <div class="navlinks" id="navlinks"></div>
    <div class="langswitch" role="group" aria-label="Site language"><button data-lang="eng">ENG</button><button data-lang="cast">CAST</button><button data-lang="cat">CAT</button></div>
    
  </div>
</nav></div></header>

<main>
<section class="hero" id="home-hero"><div id="home-bg-mount"></div><div class="wrap section-content">
  <div class="kicker" id="heroKicker"></div>
  <div class="hero-identity"><img class="hero-logo" src="assets/vianda-visual-logo.png" alt="Vianda Visual — Creative Development · Apps · Motion Graphics"></div>
  <div class="tagline" id="tagline"></div>
  <div class="intro" id="intro"></div>
</div></section>
<div id="sections"></div>
</main>

<footer><div class="wrap"><strong id="footbrand"></strong> · <span id="footertext"></span> · <span class="footer-version">v1.15</span></div></footer>

<script>window.VV_PUBLIC_BUILD=true;window.VV_PUBLIC_PREFIX="";window.VV_PUBLISHED_ASSETS={"vv-image-disturbing-stories-app": "media/vv-image-disturbing-stories-app.png", "vv-image-project-1790260152347": "media/vv-image-project-1790260152347.png", "vv-image-project-1790260160814": "media/vv-image-project-1790260160814.png", "vv-item-disturbing-player": "media/vv-item-disturbing-player.png", "vv-image-banda-de-la-cala": "media/vv-image-banda-de-la-cala.png", "vv-image-project-1790260161949": "media/vv-image-project-1790260161949.png", "vv-item-project-1790276486719": "media/vv-item-project-1790276486719.png", "vv-item-project-1790276487764": "media/vv-item-project-1790276487764.png", "vv-image-lab-01": "media/vv-image-lab-01.jpg", "vv-bg-projects": "media/vv-bg-projects.png", "vv-bg-lab": "media/vv-bg-lab.png", "vv-site-bg-audiovisual": "media/vv-site-bg-audiovisual.jpg", "vv-site-bg-about": "media/vv-site-bg-about.jpg", "vv-bg-skills": "media/vv-bg-skills.jpg", "vv-site-bg-contact": "media/vv-site-bg-contact.png", "vv-site-bg-home": "media/vv-site-bg-home.webm", "vv-item-cv-experience-1": "media/vv-item-cv-experience-1.png", "vv-item-cv-experience-2": "media/vv-item-cv-experience-2.png", "vv-item-cv-experience-3": "media/vv-item-cv-experience-3.jpg", "vv-item-cv-experience-4": "media/vv-item-cv-experience-4.jpg", "vv-cv-experience-loop-cv-experience-4": "media/vv-cv-experience-loop-cv-experience-4.webm", "vv-item-cv-experience-5": "media/vv-item-cv-experience-5.jpg", "vv-item-cv-experience-6": "media/vv-item-cv-experience-6.jpg", "vv-item-cv-experience-7": "media/vv-item-cv-experience-7.jpg", "vv-cv-experience-loop-cv-experience-7": "media/vv-cv-experience-loop-cv-experience-7.webm", "vv-item-cv-projects-1": "media/vv-item-cv-projects-1.png", "vv-item-cv-projects-2": "media/vv-item-cv-projects-2.png", "vv-item-cv-education-1": "media/vv-item-cv-education-1.png", "vv-item-cv-education-2": "media/vv-item-cv-education-2.png", "vv-item-cv-education-3": "media/vv-item-cv-education-3.jpg", "vv-cv-bg-hero": "media/vv-cv-bg-hero.jpg", "vv-cv-bg-experience": "media/vv-cv-bg-experience.jpg", "vv-cv-bg-projects": "media/vv-cv-bg-projects.png", "vv-cv-bg-education": "media/vv-cv-bg-education.png", "vv-cv-bg-languages": "media/vv-cv-bg-languages.png", "vv-cv-bg-heroMobile": "media/vv-cv-bg-heroMobile.jpg"};</script>
<script src="shared/app.js?v=1.15"></script>
<script>

function vvNormalizeModel(d){
  d.backgrounds=d.backgrounds||{};
  d.cv=d.cv||{};
  d.cv.ui=d.cv.ui||{};
  d.cv.backgrounds=d.cv.backgrounds||{};
  d.cv.experience=d.cv.experience||[];
  d.cv.projects=d.cv.projects||[];
  d.cv.education=d.cv.education||[];
  d.cv.languages=d.cv.languages||[];
  d.cv.skills=d.cv.skills||{development:[],creative:[]};
  d.cv.links=d.cv.links||{};
  for(const sid of ['hero','experience','projects','skills','education','languages','links']){
    d.cv.backgrounds[sid]=d.cv.backgrounds[sid]||{image:'',imageAssetId:'',overlay:.68,posX:50,posY:50};
  }
  for(const sid of ['home','projects','lab','audiovisual','about','skills','contact']){
    d.backgrounds[sid]=d.backgrounds[sid]||{image:'',imageAssetId:'',overlay:.62,posX:50,posY:50};
  }
  for(const group of ['experience','projects','education','languages']){
    (d.cv[group]||[]).forEach((item,i)=>{
      item.id=item.id||`cv-${group}-${i+1}`;
      if(item.image==null)item.image='';
      if(item.imageAssetId==null)item.imageAssetId='';
      if(item.imagePosX==null)item.imagePosX=50;
      if(item.imagePosY==null)item.imagePosY=50;
      if(item.video==null)item.video='';
    });
  }
  return d;
}

(async()=>{
 const d=vvNormalizeModel(await vvLoad());
 let lang=vvPageLanguage();
 await vvPrepareMedia(d.projects||[]);
 await vvPrepareMedia(d.lab||[]);
 await vvPrepareBackgrounds(d.backgrounds||{});
 await vvPrepareShowreels(d.showreels||[]);

 const homeBgMount=document.getElementById('home-bg-mount');
 if(homeBgMount) homeBgMount.innerHTML=vvSectionBackground(d.backgrounds?.home);

 function T(v){return vvText(v,lang)}
 let hasRendered=false;
 function render(){
   document.documentElement.lang=lang==='eng'?'en':lang==='cast'?'es':'ca';
   document.querySelectorAll('[data-lang]').forEach(b=>{const active=b.dataset.lang===lang;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
   document.getElementById('brand').textContent=d.global.brand;
   document.getElementById('heroKicker').textContent=T(d.ui.hero_kicker);


   document.getElementById('tagline').textContent=T(d.global.tagline);
   document.getElementById('intro').textContent=T(d.global.intro);
   document.getElementById('footbrand').textContent=d.global.brand;
   document.getElementById('footertext').textContent=T(d.global.footer);

   const sections=[...d.sections].filter(s=>s.visible).sort((a,b)=>a.order-b.order);
   document.getElementById('navlinks').innerHTML=sections.map(s=>`<a href="#${s.id}">${vvEsc(T(s.label))}</a>`).join('');


   const openedProjects=new Set([...document.querySelectorAll('.vv-project-card.is-open')].map(c=>c.dataset.projectId));
   const mediaLabel=T(d.ui.media);
   const target=document.getElementById('sections');
   target.innerHTML='';

   const templates={
    projects:()=>`<section id="projects">${vvSectionBackground(d.backgrounds?.projects)}<div class="wrap section-content">
      <div class="section-head"><div><div class="eyebrow">${vvEsc(T(d.ui.selected_work))}</div><h2>${vvEsc(T(d.ui.projects_title))}</h2></div></div>
      <div class="projects-grid">
      ${d.projects.filter(x=>x.visible).sort((a,b)=>a.order-b.order).map(p=>`<article class="card vv-project-card" data-project-id="${vvEsc(String(p.id))}" data-reopen="${openedProjects.has(String(p.id))?'1':'0'}"><button type="button" class="vv-project-toggle" aria-expanded="false" aria-label="${vvEsc(T(p.title))}" title="${vvEsc(T(p.title))}">${vvMedia(p,lang,mediaLabel)}</button><div class="vv-project-reveal"><div class="vv-project-inner">${vvVideoEmbed(p.video)}
        <div class="card-body"><h3>${vvEsc(T(p.title))}</h3><div class="sub">${vvEsc(T(p.subtitle))}</div>
        <div class="tags">${vvEsc(T(p.tags))}</div><p>${vvEsc(T(p.description))}</p>
        ${p.url?`<a class="cta" href="${vvEsc(p.url)}" target="_blank" rel="noopener">${vvEsc(T(d.ui.view_project))}</a>`:''}
        </div></div></div></article>`).join('')}</div></div></section>`,
    lab:()=>`<section id="lab">${vvSectionBackground(d.backgrounds?.lab)}<div class="wrap section-content">
      <div class="section-head"><div><div class="eyebrow">${vvEsc(T(d.ui.lab_eyebrow))}</div><h2>${vvEsc(T(d.ui.lab_title))}</h2></div></div>
      <div class="cards-grid">
      ${d.lab.filter(x=>x.visible).sort((a,b)=>a.order-b.order).map(p=>`<article class="card">${vvMedia(p,lang,mediaLabel)}${vvVideoEmbed(p.video)}
        <div class="card-body"><h3>${vvEsc(T(p.title))}</h3><p>${vvEsc(T(p.description))}</p>
        ${p.url?`<a class="cta" href="${vvEsc(p.url)}" target="_blank" rel="noopener">${vvEsc(T(d.ui.explore))}</a>`:''}</div></article>`).join('')}</div></div></section>`,
    audiovisual:()=>`<section id="audiovisual">${vvSectionBackground(d.backgrounds?.audiovisual)}<div class="wrap split section-content">
      <div><div class="eyebrow">${vvEsc(T(d.ui.motion_label))}</div><h2>${vvEsc(T(d.audiovisual.title))}</h2><p class="bigcopy">${vvEsc(T(d.audiovisual.subtitle))}</p></div>
      <div><p class="copy">${vvEsc(T(d.audiovisual.body))}</p><div class="tags">${vvEsc(T(d.audiovisual.services))}</div></div></div></section>`,
    about:()=>`<section id="about">${vvSectionBackground(d.backgrounds?.about)}<div class="wrap split section-content">
      <div><div class="eyebrow">${vvEsc(T(d.ui.about_label))}</div><h2>${vvEsc(T(d.about.title))}</h2></div><div><p class="copy">${vvEsc(T(d.about.body))}</p></div></div></section>`,
    skills:()=>`<section id="skills">${vvSectionBackground(d.backgrounds?.skills)}<div class="wrap section-content">
      <div class="section-head"><div><div class="eyebrow">${vvEsc(T(d.ui.skills_label))}</div><h2>${vvEsc(T(d.ui.skills_title))}</h2></div></div>
      <div class="split"><div><h3>${vvEsc(T(d.ui.development))}</h3><div class="pills">${d.skills.development.map(x=>`<span class="pill">${vvEsc(T(x))}</span>`).join('')}</div></div>
      <div><h3>${vvEsc(T(d.ui.creative))}</h3><div class="pills">${d.skills.creative.map(x=>`<span class="pill">${vvEsc(T(x))}</span>`).join('')}</div></div></div></div></section>`,
    contact:()=>`<section id="contact">${vvSectionBackground(d.backgrounds?.contact)}<div class="wrap split section-content">
      <div><div class="eyebrow">${vvEsc(T(d.ui.contact_label))}</div><h2>${vvEsc(T(d.contact.headline))}</h2></div>
      <div><p class="copy">${vvEsc(T(d.contact.body))}</p><div class="links">
      ${['email','linkedin','github','behance','imdb'].filter(k=>d.contact[k]).map(k=>{let u=d.contact[k];if(k==='email'&&!u.startsWith('mailto:'))u='mailto:'+u;return `<a class="${k==='email'||k==='linkedin'?'vv-contact-main':''}" href="${vvEsc(u)}" target="${k==='email'?'_self':'_blank'}">${k.toUpperCase()} ↗</a>`}).join('')}
      </div></div></div></section>`
   };
   target.insertAdjacentHTML('beforeend',vvShowreelsAfter(d.showreels||[],'home'));
   sections.forEach(s=>{if(templates[s.id]){target.insertAdjacentHTML('beforeend',templates[s.id]());target.insertAdjacentHTML('beforeend',vvShowreelsAfter(d.showreels||[],s.id));}});
   document.querySelectorAll('.vv-project-card').forEach(card=>{
     const button=card.querySelector('.vv-project-toggle');
     if(card.dataset.reopen==='1'){card.classList.add('is-open');button.setAttribute('aria-expanded','true');}
     button.addEventListener('click',()=>{
       const next=card.classList.toggle('is-open');
       button.setAttribute('aria-expanded',String(next));
     });
   });
   if(!hasRendered){hasRendered=true;vvTypeText(document.body);}
 }
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(lang===b.dataset.lang)return;vvStopTyping();lang=b.dataset.lang;vvSetLang(lang);vvUpdateLanguageURL(lang);render()});
 window.addEventListener('popstate',()=>{const next=vvPageLanguage();if(next!==lang){vvStopTyping();lang=next;render()}});
 render();
})();
</script>
</body></html>
